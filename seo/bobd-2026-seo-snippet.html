brand last year with the idea that signature scents are a myth. What we really need is a rotation of niche, high-quality scents based on our mood of the moment.","disambiguatingDescription":"Best Local Perfumer, The Best of Big D 2026","sameAs":"https://lepoqueparfums.com"}},{"@type":"ListItem","position":109,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-kd-biel","name":"KD Biel","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-kd-biel","description":"After opening in the Design District last year, this housewares store quickly expanded with a second location on Knox and the addition of a registry service. Nary a KitchenAid stand mixer here, but you will find exquisite Italian table linens, Swedish brass candlesticks, and Australian porcelain dinnerware, all exclusive to KD Biel.","disambiguatingDescription":"Best Bridal Registry, The Best of Big D 2026"}},{"@type":"ListItem","position":110,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-twelve-thirty-four","name":"Twelve Thirty Four","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-twelve-thirty-four","description":"Patricio Rivera is a sculptor who happens to work with flowers. His arrangements command a room, but what really sets him apart is the vessel. He knows the container matters just as much as the blooms and fills his shop with one-ofa-kind vases, including stunning pieces by local artists Barbara Harvel and Brooks Oliver.","disambiguatingDescription":"Best Florist, The Best of Big D 2026"}},{"@type":"ListItem","position":111,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-nicholson-hardie-home-and-garden","name":"Nicholson-Hardie Home and Garden","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-nicholson-hardie-home-and-garden","description":"Don’t let its humble exterior fool you. Nicholson-Hardie is much more than a gardening shop. With Nest candles, Assouline coffee table books, Steiffteddy bears, and the softest pajamas, it’s the first place we go when we need a sure-to-please gift for the snobs we know and love.","disambiguatingDescription":"Best Gift Shop, The Best of Big D 2026"}},{"@type":"ListItem","position":112,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-half-price-books","name":"Half Price Books","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-half-price-books","description":"We have long appreciated the flagship’s “people’s store” aura: the tables full of retirees playing pickup mahj and undergrads cramming. But recently we’ve been gobsmacked by the events with blockbuster authors: Matt Dinniman of Dungeon Crawler Carl , and Annabel Monaghan, the witty romance queen. So litty, HPB.","disambiguatingDescription":"Best Bookstore, The Best of Big D 2026"}},{"@type":"ListItem","position":113,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-odyssey-pets","name":"Odyssey Pets","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-odyssey-pets","description":"It doesn’t have the most Instagrammable aesthetic of the pet shops in town, but Odyssey is the top dog when it comes to grooming services. The staffis knowledgeable, friendly, and happy to help with larger breeds other groomers won’t take. We love their adoption, educational, and philanthropic events, too.","disambiguatingDescription":"Best Pet Store, The Best of Big D 2026"}},{"@type":"ListItem","position":114,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-north-haven-gardens","name":"North Haven Gardens","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-north-haven-gardens","description":"Beyond its expansive offering of indoor and outdoor plants (we’re partial to its selection of natives), this shop can teach you a thing or two, too. Garden advisors take your dumbest questions seriously, and their classes cover everything from plant life cycles to growing wildflowers from seed. At-home coaching is also available.","disambiguatingDescription":"Best Nursery and Garden Shop, The Best of Big D 2026"}},{"@type":"ListItem","position":115,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mimis-needlepoint","name":"Mimi's Needlepoint","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mimis-needlepoint","description":"The slogan “not your Mimi’s needlepoint” tells you all you need to know about Bishop Arts’ newest craft shop. The owners, Amelia and Madeline Alford (pictured right, a former D employee), started with their own Etsy line of millennial- and Gen Z-specific designs, and now that same breed of snarky, pop-culture, and internet-humor canvases is a specialty.","disambiguatingDescription":"Best Needlework Store, The Best of Big D 2026"}},{"@type":"ListItem","position":116,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-ylang-23","name":"Ylang 23","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-ylang-23","description":"This Shops of Highland Park store has been curating pieces from rising jewelry designers for more than 35 years. Cases are full of bold, colorful, and fresh styles. Think oversize pendants and bright beads from names such as Jennifer Meyer and FoundRae. While the styles may be fashion-forward, every piece is heirloom quality.","disambiguatingDescription":"Best New Jewelry for the Fashion Forward, The Best of Big D 2026"}},{"@type":"ListItem","position":117,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mecox","name":"Mecox","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mecox","description":"If accessories are the jewelry of interior design, Mecox is your go-to home jeweler. With fresh inventory dropping constantly, Mecox entices you to swing by regularly, as the best pieces don’t stay long. Be sure to check out curated collections by local artists such as ceramics by Jim Tompkins and Paul Schneider.","disambiguatingDescription":"Best Home Accessories, The Best of Big D 2026"}},{"@type":"ListItem","position":118,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-good-things-for-all-seasons","name":"Good Things for All Seasons","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-good-things-for-all-seasons","description":"This nearly 30-year-old Grapevine shop is alternately overrun with Easter bunnies, Uncle Sams, and skeletons, depending on the time of year. And while it earns its place in the heart of the self-proclaimed Christmas Capital of Texas each November and December, you can stop in any time of the year to shop holiday village displays in rear rooms.","disambiguatingDescription":"Best Holiday Shop, The Best of Big D 2026"}},{"@type":"ListItem","position":119,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-color-box-letterpress","name":"Color Box Letterpress","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-color-box-letterpress","description":"Founder Rhonda Camp Warren’s selection of ready-made and semicustom stationery makes it fun to share (and receive) sentiments via snail mail. We also love the less traditional ways she enables you to express your love—with business-card-size “emoticards” or, if the way to their heart is through their stomach, charcuterie cheat sheets.","disambiguatingDescription":"Best Way to Say I Love You, The Best of Big D 2026"}},{"@type":"ListItem","position":120,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-leatherology","name":"Leatherology","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-leatherology","description":"This Dallas-based e-commerce brand carries leather staples—purses, wallets, and luggage—plus fun extras like office goods and a new sporting collection. Pieces are easily customizable with plenty of colors and monogramming options, as well as the ability to emboss your own artwork or handwriting on a keepsake.","disambiguatingDescription":"Best Leather Goods, The Best of Big D 2026","sameAs":"https://leatherology.com"}},{"@type":"ListItem","position":121,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-greenlocke-house","name":"Greenlocke House","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-greenlocke-house","description":"Friends Lauren Cooper and Kenzie Killgore translated their love for sourcing vintage art into an e-commerce-based gallery of secondhand finds. These aren’t no-name garage-sale scores; artist information is provided for each piece. Still, most of their inventory of oils on canvas—largely landscapes and still lifes—are snaggable for under $1,000.","disambiguatingDescription":"Best Approachable Art, The Best of Big D 2026","sameAs":"https://greenlockehouse.com"}},{"@type":"ListItem","position":122,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-crescent-hotel-fort-worth-canyon-ranch","name":"The Crescent Hotel, Fort Worth \u0026 Canyon Ranch","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-crescent-hotel-fort-worth-canyon-ranch","description":"Hotel Crescent Court’s sister property to the west is cosmopolitan and comfortable without an ounce of cowboy kitsch. Book an overnight stay and score access to Canyon Ranch, a world-class wellness club that offers fitness classes, spa services, and holistic recovery experiences. Despite being just 30 miles from home, you’ll feel totally transported.","disambiguatingDescription":"Best Place for a Staycation, The Best of Big D 2026"}},{"@type":"ListItem","position":123,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-nick-brock-company","name":"Nick Brock \u0026 Company","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-nick-brock-company","description":"A few years into its Design District era, this former Henderson Avenue staple is offering the same great selection with extra room to flex. We are obsessed for one reason: where else can you leave with a $25,000 “priceless” piece in one hand and a $40 catchall in the other?","disambiguatingDescription":"Best Antiques Store, The Best of Big D 2026"}},{"@type":"ListItem","position":124,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-standard-mckinney","name":"The Standard McKinney","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-standard-mckinney","description":"We’d gladly trade in our corner office (read: cubicle) for the trad-wife life if our kitchen was outfitted only in beautiful but functional wares from this downtown McKinney shop. In addition to handcrafted serving pieces, cookware, and kitchen tools, they stock small-batch pantry items, cool cookbooks, and organic cleaning products worthy of the hautest homestead.","disambiguatingDescription":"Best Kitchen Goods, The Best of Big D 2026"}},{"@type":"ListItem","position":125,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-paper-arts","name":"Paper Arts","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-paper-arts","description":"Stop scrolling the big-box craft sites, and head to Paper Arts in Old East Dallas instead. Owner Terri Thoman has spent 40-plus years sourcing incredible papers from around the globe. Between the live origami demos and printmaking workshops, it’s pure tactile inspiration you’ll never get with online shopping.","disambiguatingDescription":"Best Arts and Crafts Store, The Best of Big D 2026"}},{"@type":"ListItem","position":126,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-st-michaels-womans-exchange","name":"St. Michael's Woman's Exchange","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-st-michaels-womans-exchange","description":"Whether you buy it in-store or bring it from elsewhere, if you can physically gift it, the volunteers at this nonprofit shop can wrap it. They handle one-offpresents and corporate gifting needs with equal panache and precise corners, and they’ll get creative when paper won’t do.","disambiguatingDescription":"Best Gift Wrap Service, The Best of Big D 2026"}},{"@type":"ListItem","position":127,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-scott-cooner","name":"Scott + Cooner","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-scott-cooner","description":"From a sofa shaped like a giant stuffed bear to a desk crafted to resemble an oversize book, you never know what you’ll see at Scott + Cooner. While it peppers its showroom with unexpected conversation pieces, the store’s staples are sleek, modern classics from lines such as Cassina and de Sede.","disambiguatingDescription":"Best Contemporary Furniture, The Best of Big D 2026"}},{"@type":"ListItem","position":128,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-stay-fit-studio","name":"Stay Fit Studio","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-stay-fit-studio","description":"You could argue that “Stay Fit Britt” Everett is Dallas’ own Tracy Anderson. The personal trainer also turned her fitness method into a multiplatform brand—just with more Pilates, strength, and sculpt than Anderson’s danceforward workouts. Everett’s first in-person studio is a stunning, and extremely challenging, representation of what she’s built.","disambiguatingDescription":"Best Boutique Gym, The Best of Big D 2026"}},{"@type":"ListItem","position":129,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-discount-home-warehouse","name":"Discount Home Warehouse","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-discount-home-warehouse","description":"When Highland Park’s iconic Mushroom House came down, we knew where to hunt for the salvaged treasure. Discount Home Warehouse is the ultimate demolition store. From one-of-a-kind vintage light fixtures and double doors packed with character to entire kitchens for your next big remodel, chances are they’ve got the scraps to complete your unique project.","disambiguatingDescription":"Best Home Salvage Shop, The Best of Big D 2026"}},{"@type":"ListItem","position":130,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dondolo","name":"Dondolo","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dondolo","description":"Yes, infants outgrow clothes faster than you can say “insufficient funds.” But here are our two cents: dress your children in the finest, most fanciful garb you can before baggy t-shirts and Crocs become their uniform. Dondolo makes classic clothing that’ll make you nostalgic for the baby days, even when you’re still in them.","disambiguatingDescription":"Best Baby Fashion, The Best of Big D 2026"}},{"@type":"ListItem","position":131,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-scout-design-studio","name":"Scout Design Studio","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-scout-design-studio","description":"Ready to have the time of your life? Head to Scout Design Studio for some wild finds—from a stone bust of Patrick Swayze to a cigarette butt side table. Just remember: nobody puts these babies in a corner. Scout’s statement pieces are made to be front and center.","disambiguatingDescription":"Best Dopamine Decor, The Best of Big D 2026"}},{"@type":"ListItem","position":132,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-babybliss","name":"Babybliss","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-babybliss","description":"You can’t know how soft a onesie feels, if the pockets on that diaper bag will fit your preferred bottle brand, or how easily you can collapse that trendy stroller one-handed until you’ve touched, tried, and tested them in real life. This Snider Plaza mainstay helps new parents get confidently in gear.","disambiguatingDescription":"Best Baby Registry, The Best of Big D 2026"}},{"@type":"ListItem","position":133,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-toy-maven","name":"The Toy Maven","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-toy-maven","description":"Though this local institution recently opened its fourth North Texas location, in NorthPark Center, our fave is still the original Preston Royal shop. The selection is expansive but not overwhelming, stocked with a delightful mix of classic and trending toys for all ages and interests.","disambiguatingDescription":"Best Toy Store, The Best of Big D 2026"}},{"@type":"ListItem","position":134,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-blue-print","name":"Blue Print","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-blue-print","description":"It’s safe to say Blue Print defines Dallas style. A mix of fun, colorful patterns and traditional shapes will make you on-trend today and timeless tomorrow. It has two Dallas locations (plus a gallery annex). You could easily walk in and furnish your entire home in one fell swoop.","disambiguatingDescription":"Best Traditional Furniture, The Best of Big D 2026"}},{"@type":"ListItem","position":135,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-oil-and-cotton","name":"Oil and Cotton","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-oil-and-cotton","description":"In addition to adult classes and workshops highlighting an array of mediums, this 16-year-old creative haven offers weekly classes and camps for kids, ranging from teens to toddlers as young as 2. Options for the younger set include drawing, painting, collage, and loom weaving. Lessons are always engaging, enriching, and age-appropriate.","disambiguatingDescription":"Best Art Studio for Kids, The Best of Big D 2026"}},{"@type":"ListItem","position":136,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-sputnik-modern","name":"Sputnik Modern","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-sputnik-modern","description":"You don’t need to be a mid-century expert to shop here. Chris Thurman knows the story behind every single piece, from a Hans Wegner “China” chair to a giant leather rhinoceros bench by Valenti. Best of all, everything is restored so meticulously that it looks even better than the day it was made.","disambiguatingDescription":"Best Vintage Furniture, The Best of Big D 2026"}},{"@type":"ListItem","position":137,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-birds-bookstore","name":"Bird's Bookstore","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-birds-bookstore","description":"There are stores that have a wider selection, but this Preston Royal newcomer appeals to the Montessori-minded with a quality-over-quantity approach. Titles are thoughtful and thought-provoking, and the wood-wrapped reading room is just-right-size for little readers. Check out their new kids’ movie night series, too.","disambiguatingDescription":"Best Bookstore for Kids, The Best of Big D 2026"}},{"@type":"ListItem","position":138,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-bellinvito","name":"Bell'Invito","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-bellinvito","description":"Brides and families look to Bell’Invito for masterful stationery in Dallas. Founder and etiquette expert Heather Wiese is best known for beautiful custom work: monogrammed, wedding, and holiday stationery especially. But procrastinators need not sacrifice quality. Equally elegant semicustom options are available in a pinch.","disambiguatingDescription":"Best Custom Stationer, The Best of Big D 2026"}},{"@type":"ListItem","position":139,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-holos-house","name":"Holos House","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-holos-house","description":"This downtown McKinney shop is super wholesome without feeling dated. Think Little House on the Prairie, but the Ingalls fam got a high-end designer makeover. Owners Rachel and Daniel Brasch bring their design-build expertise to a cozy space where you can pop in, grab a gift, and get inspired.","disambiguatingDescription":"Best Down-Home Decor, The Best of Big D 2026"}},{"@type":"ListItem","position":140,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-garde","name":"Garde","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-garde","description":"Shopping at this home-furnishings store is like walking through a gallery. It looks minimal at first, but you’ll spend hours obsessing over every detail; each piece is a literal work of art. We cheered when it opened in the Design District, filling a niche we were missing: something completely different.","disambiguatingDescription":"Best Place to Break the Mold, The Best of Big D 2026"}},{"@type":"ListItem","position":141,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-lula-bs","name":"Lula B's","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-lula-bs","description":"Both the Oak Cliffand Design District locations live up to their “cool stufffor cool people” tagline. The booths at Lula B’s are packed with rare finds, so allot plenty of time to explore and dig. Keep up with their Instagram, where they post daily their new pieces.","disambiguatingDescription":"Best Vintage Dig, The Best of Big D 2026"}},{"@type":"ListItem","position":142,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-weston-table","name":"Weston Table","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-weston-table","description":"If your aesthetic happy place is the late ’80s, welcome home. Weston Table is packed with tartan, hunter green, burgundy, and rich woods. Think Ralph Lauren meets L.L.Bean, with a serious Match pewter situation—the entire collection is here. It makes setting the table for no reason at all feel like a good idea.","disambiguatingDescription":"Best Reason to Have a Dinner Party, The Best of Big D 2026"}},{"@type":"ListItem","position":143,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-linny-co","name":"Linny Co","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-linny-co","description":"Founder Lindsey Adams Williams wanted fashion without compromising comfort. Her waterproof, hypoallergenic screw-back studs come in everyday shapes (hearts, flowers, pearls) and whimsical ones, too (Christmas trees, cowboy boots, snowflakes). And after a long day of looking so chic, the flat backs won’t poke you when you lay down your weary head.","disambiguatingDescription":"Best Nap Studs, The Best of Big D 2026"}},{"@type":"ListItem","position":144,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-good-records","name":"Good Records","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-good-records","description":"As their t-shirts say, you can’t roll a joint on a digital download. This is where you go for vinyl (and CDs and tapes) and live in-store performances that truly create that overused word: community. When Leon Bridges dropped his latest album, he came here for a meet-andgreet. That’s Happiness Anytime.","disambiguatingDescription":"Best Record Store, The Best of Big D 2026"}},{"@type":"ListItem","position":145,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cypress","name":"Cypress","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cypress","description":"The constellation of cool Dallas menswear stores gets a little bigger every year. The latest star to know: Cypress, a men’s- and unisex-focused collective by Cole Levine. Book a private or virtual appointment to shop the cult Scandinavian minimalist label Mfpen or selvedge denim by Yoko Sakamoto.","disambiguatingDescription":"Best Men’s Clothing Boutique, The Best of Big D 2026","sameAs":"https://cypressclothiers.com"}},{"@type":"ListItem","position":146,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-debra-stevens-custom-framing","name":"Debra Stevens Custom Framing","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-debra-stevens-custom-framing","description":"When she’s not napping with oversize babies at the elephant orphanage she co-founded in Botswana, Stevens is taking equal care both with priceless museum-size works of art and your twee Wipstitch needlepoint canvas. She has an impeccable eye for finding the treatment that makes each piece pop.","disambiguatingDescription":"Best Custom Framing, The Best of Big D 2026"}},{"@type":"ListItem","position":147,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-p-s-terminal","name":"P/S Terminal","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-p-s-terminal","description":"If flying commercial weren’t bad enough, now everyone and his mother has lounge access. P/S is the new semiprivate solve: a gorgeous, new terminal with its own TSA checkpoint, Champagne and caviar service, and private suites if the salon bar is still too public.","disambiguatingDescription":"Best Business Expense, The Best of Big D 2026","sameAs":"https://reserveps.com"}},{"@type":"ListItem","position":148,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-yokie","name":"Yokie","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-yokie","description":"Alternative R\u0026B on the speakers. Limewash on the walls. Vintage Ralph Lauren and fresh Momotaro denim on the racks. Shay Thompson’s downtown McKinney shop may be small, but the energy is strong. Go on the weekend to kick it with other dudes who care about what they wear.","disambiguatingDescription":"Best Men’s Vintage Style, The Best of Big D 2026"}},{"@type":"ListItem","position":149,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-metro-vcs","name":"Metro VCS","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-metro-vcs","description":"“Print is dead,” said Egon Spengler in Ghostbusters , but this crew is proving him wrong. They offer the raw grit of true printmaking: the smell of fresh ink and the clatter of the letterpress and engraving machines. Plus, you can actually oversee your job on-site and make adjustments on the press in the print factory.","disambiguatingDescription":"Best Family-Owned Printers, The Best of Big D 2026"}},{"@type":"ListItem","position":150,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-shasa-mitcham-at-the-conservatory","name":"Shasa Mitcham at the Conservatory","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-shasa-mitcham-at-the-conservatory","description":"The Conservatory in Highland Park Village carries rare fragrance houses such as Maison d’Etto, Ex Nihilo, and Perfumehead. But the real draw is Shasa Mitcham, whom we dubbed “The Best Nose in Dallas.” His superpower is pinpointing your ideal scent before you even know what you’re looking for.","disambiguatingDescription":"Best Nose, The Best of Big D 2026"}},{"@type":"ListItem","position":151,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-am-fm","name":"AM/FM","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-am-fm","description":"You could spend the whole day at this diner-by-day, music-venue-by-night Design District newcomer, which took over the Ferris Wheelers spot. The whole menu is a smash hit, but don’t miss the pozole grits. Once you’re fueled, head to the backyard to catch bands, musicians, or DJs playing in the moonlight.","disambiguatingDescription":"Best Day-To-Night Combo, The Best of Big D 2026"}},{"@type":"ListItem","position":152,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-wild-detectives","name":"The Wild Detectives","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-wild-detectives","description":"It’s not day drinking if you’re reading a book. Besides, during happy hour, if you buy a book, your next drink is free. Take a seat inside the shop, on the front porch, or in the shady backyard, which, with its picnic tables and restful quiet, is ideal for reading. And the other thing.","disambiguatingDescription":"Best Place to Day Drink, The Best of Big D 2026"}},{"@type":"ListItem","position":153,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-on-rotation-brewery-kitchen","name":"On Rotation Brewery \u0026 Kitchen","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-on-rotation-brewery-kitchen","description":"The aviation theme fits On Rotation’s setting on the edge of Love Field. The split-level patio offers space for both kids and grown-ups. And the tap list is a wide-ranging mix of its own excellent beers and well-chosen guest brews. On Wednesday, beers running low are half price.","disambiguatingDescription":"Best Taproom, The Best of Big D 2026"}},{"@type":"ListItem","position":154,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-silo","name":"Silo","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-silo","description":"With a d\u0026b Audiotechnik sound system, and a 108-linear-foot 4K video wall, and 32,000 square feet of rave space, this former grain silo has served as a local landing pad for electronic legends, including Tiësto, Diplo, Zedd, and Fatboy Slim. Discover up-and-comers inside Ductwork, the venue’s “techno speakeasy.”","disambiguatingDescription":"Best EDM Club, The Best of Big D 2026"}},{"@type":"ListItem","position":155,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-bar-leonessa-at-the-stoneleigh","name":"Bar Leonessa at the Stoneleigh","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-bar-leonessa-at-the-stoneleigh","description":"This spring, a $20 million renovation revived the 103-year-old Uptown hotel. The lush, glamorous transformation vaulted The Stoneleigh into top Dallas hotel territory, but our favorite new feature may be Bar Leonessa’s Tiny Tini. Snag two for $13 during weeknight happy hours.","disambiguatingDescription":"Best Bar Resurrection, The Best of Big D 2026"}},{"@type":"ListItem","position":156,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dansungsa","name":"Dansungsa","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dansungsa","description":"There’s no better fuel for a night of karaoke than a heaping platter of Korean fried chicken, some bulgogi quesadillas, and a few affordable bottles of soju. DanSungSa’s semiprivate booths and bumping soundtrack add ; 4:30 on Fridays and Saturdays.","disambiguatingDescription":"Best Late-Night Eats, The Best of Big D 2026"}},{"@type":"ListItem","position":157,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dj-alaska","name":"DJ Alaska","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dj-alaska","description":"DJ Alaska, aka Alaska Quiñones, is the face-painted ringmaster behind clown raves and a thriving subculture among Dallas alts and goths. The Oak Cliffpayasita mixes cumbias, rock, and hyperpop into electrifying sets, and she has taken her act to Atlanta, where she opened for Japanese DJ Yousuke Yukimatsu.","disambiguatingDescription":"Best DJ, The Best of Big D 2026","sameAs":"https://instagram.com/cosmicgirlalaska"}},{"@type":"ListItem","position":158,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-vector-brewing","name":"Vector Brewing","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-vector-brewing","description":"Lake Highlands’ favorite brewpub had a big year in 2026, collaborating with a Bolivian chef (a mocochinchi-spiced amber), Mississippi and Austin breweries (a hoppy pilsner and dark rice lager), and the Oak Cliff Film Festival (an oat lager). As for the saison aged in Malört barrels, hey, they’ll try anything.","disambiguatingDescription":"Best Brewery, The Best of Big D 2026"}},{"@type":"ListItem","position":159,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-strangeways","name":"Strangeways","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-strangeways","description":"What a great record store is to music, Strangeways is to beer. Yes, you can find some chart-toppers, but the joy comes from combing through the 40 beers on tap to find your groove among the hidden gems from many of the best breweries in and out of Dallas.","disambiguatingDescription":"Best Bar for Beer, The Best of Big D 2026"}},{"@type":"ListItem","position":160,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tavern-on-main-street","name":"Tavern on Main Street","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tavern-on-main-street","description":"Rule of thumb: don’t order gravy at a dive bar. This Richardson mainstay is the exception, with a scratch kitchen that slathers the good stuffon chicken-fried steak as well as a mushroom-Swiss burger. But you need not eat to have a good time. The live music upstairs thumps, and the beer is cheap.","disambiguatingDescription":"Best Dive Bar with Dinner, The Best of Big D 2026"}},{"@type":"ListItem","position":161,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-neighborhood-cellar","name":"Neighborhood Cellar","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-neighborhood-cellar","description":"For such a small shop, this Oak Cliffgem has a little bit of everything. Topshelf Champagne for a classy soirée? They have it. An underappreciated $20 rosé? That, too. Funky natural wines and old-world classics sit side by side on the racks. If you can’t choose, sit down for a glass before shopping.","disambiguatingDescription":"Best Neighborhood Wine Shop, The Best of Big D 2026"}},{"@type":"ListItem","position":162,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dickies-arena","name":"Dickies Arena","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dickies-arena","description":"This Cowtown venue on the cusp of a name change hosted huge names in 2026, including Eric Church, Luke Bryan, Phoebe Bridgers, and Ella Langley, but the 14,000-seat space feels more intimate and less cavernous than other arenas. It’s also home to the largest L-Acoustics arena sound system. Translation: music just sounds better here.","disambiguatingDescription":"Best Live Music Venue, The Best of Big D 2026"}},{"@type":"ListItem","position":163,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-zon-zon-162","name":"Zon Zon","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-zon-zon-162","description":"Any of six outstanding cocktails runs you $9. Plunk down a few more bucks, and you get a meze trio featuring the best hummus in town, each batch made to order. And Zon Zon didn’t forget the wine drinkers: a bartender-selected bottle runs half price.","disambiguatingDescription":"Best Happy Hour, The Best of Big D 2026"}},{"@type":"ListItem","position":164,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-saint-valentine","name":"Saint Valentine","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-saint-valentine","description":"Set Misti Norris’ inventive mind loose on a bar, and you might wind up with a Southeast Asian hot dog, a cheffy cereal bowl for dessert, and chicken nuggets with serious culinary credentials. We won’t trigger your envy by telling you about the now-departed pastrami musubi.","disambiguatingDescription":"Best Bar Food, The Best of Big D 2026"}},{"@type":"ListItem","position":165,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-sor-juana","name":"Sor Juana","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-sor-juana","description":"Downtown’s new Mexican cantina takes the drinking snack seriously. With every round, your table will get a different morsel: spiced nuts, fresh fruit, a cup of broth. By all means, avail yourself of the traditional food menu, too, but the warm hospitality of these botanas will stick in your memory.","disambiguatingDescription":"Best Botanas, The Best of Big D 2026"}},{"@type":"ListItem","position":166,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-seager-sons","name":"Seager \u0026 Sons","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-seager-sons","description":"Matchbooks are all the rage in personalized home decor lately (sure, why not?), and this Plano restaurant offers the most whimsical of all. Retro illustrations aren’t just on the front and back of the matchbook, but also on each individual match. Only downside: you’ll never want to light them.","disambiguatingDescription":"Best Matchbook, The Best of Big D 2026"}},{"@type":"ListItem","position":167,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-boogies-disco-nnected","name":"Boogies, Disco(nnected)","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-boogies-disco-nnected","description":"The punny name doesn’t lie. Your phone’s camera will be blinded when the bouncer tapes it upon entry. That’s the point: take a break from the screen, and dance like no one can see you on Snapchat. Cuz they can’t.","disambiguatingDescription":"Best Dance Party, The Best of Big D 2026"}},{"@type":"ListItem","position":168,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-charlotte","name":"The Charlotte","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-charlotte","description":"Two of these ’tinis will have you buying The Charlotte’s signature teddy bears offthe menu. Yes, the porn star martini is strong, but deliciously sweet, thanks to the restaurant’s twist on the London classic—a dash of pineapple juice enhancing the usual concoction of vanilla vodka and passion fruit liqueur.","disambiguatingDescription":"Best Porn Star Martini, The Best of Big D 2026"}},{"@type":"ListItem","position":169,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tipsy-elf","name":"Tipsy Elf","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tipsy-elf","description":"Each holiday season, the bars on Bishop Lane transform into an interconnected, over-the-top winter wonderland with twinkling lights, thousands of ornaments hanging on every spare surface, and mini (inedible) presents in cocktails. The life-size Elf on the Shelf at the entrance is positioned perfectly for photos in his embrace.","disambiguatingDescription":"Best Holiday Pop-Up Bar, The Best of Big D 2026","sameAs":"https://instagram.com/tipsyelfdallas"}},{"@type":"ListItem","position":170,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-harwood-arms","name":"Harwood Arms","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-harwood-arms","description":"This Uptown pub doesn’t just provide an emcee pushing play on karaoke tracks. Every Thursday night, a live band posts up to back all the wannabe Lindsey Buckinghams, Taylor Swifts, and Freddie Mercurys. Performers, beware: you’re not just background noise for this crowd; they expect you to entertain.","disambiguatingDescription":"Best Karaoke, The Best of Big D 2026"}},{"@type":"ListItem","position":171,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-worldsprings","name":"Worldsprings","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-worldsprings","description":"Drop by during the day for a soothing thermal circuit (sauna, cold plunge, hot spring). Or drop by at night to do it all with cocktails and a bit more socializing. There are a variety of ways to experience WorldSprings, but they all help with circulation.","disambiguatingDescription":"Best Boozy Getaway, The Best of Big D 2026"}},{"@type":"ListItem","position":172,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-las-almas-rotas","name":"Las Almas Rotas","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-las-almas-rotas","description":"The backbar library of tequila, mezcal, sotol, raicilla, and other Mexican spirits should rank as a local landmark and tourist attraction. It’s one of the most impressive collections in the United States. But if you’re intimidated, you can sample the clever, refreshing cocktails.","disambiguatingDescription":"Best Agave Bar, The Best of Big D 2026"}},{"@type":"ListItem","position":173,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-bourbon-banter","name":"Bourbon \u0026 Banter","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-bourbon-banter","description":"Entering The Statler’s sultry basement spot feels like an illicit, Prohibition-era rendezvous, where the martinis are just as smooth as the pipes of the live jazz singer. Whether you’re on a date with your boo or your besties, your night will find life in the haze of dim lighting and a tobacco Old Fashioned.","disambiguatingDescription":"Best Speakeasy, The Best of Big D 2026"}},{"@type":"ListItem","position":174,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-revelers-hall","name":"Revelers Hall","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-revelers-hall","description":"The Bishop Arts music venue is known for lively jazz performances, but its cocktail menu deserves applause, too. Its offthe-menu carajillo, a Mexican-inspired alternative to the espresso martini, combines rich coffee and mezcal beneath an exceptionally creamy foam. Check the calendar online to pair your cocktail with live tunes.","disambiguatingDescription":"Best Carajillo, The Best of Big D 2026"}},{"@type":"ListItem","position":175,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-mansion-bar","name":"The Mansion Bar","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-mansion-bar","description":"Gunpowder Gin, sunset-hued house-made tonic, a strip of grapefruit zest, and a makrut lime leaf: the Mansion’s house G\u0026T is iconic. So is its equestrian-themed setting with its handcarved fireplace. Add live Sinatra-style crooners on weekends, and you can feel like a billion bucks for the price of a dry-aged burger.","disambiguatingDescription":"Best Hotel Bar, The Best of Big D 2026"}},{"@type":"ListItem","position":176,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-queens-head-pub","name":"Queen's Head Pub","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-queens-head-pub","description":"This place debuted for the World Cup, and daytime lines formed to watch matches—in Deep Ellum! Justly so. The multiple interior spaces are comfortable. The Scotch egg has a perfectly tender yolk. The chips with the fish are a clever American twist. And the backbar once sat in the Green Room. IYKYK.","disambiguatingDescription":"Best Pub, The Best of Big D 2026"}},{"@type":"ListItem","position":177,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-clifton-club","name":"Clifton Club","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-clifton-club","description":"If the scene on the Oak Lawn strip overwhelms the senses, this dimly lit lounge serves as a coping strategy via cozy booths, stiffcocktails, and a happy hour “kid’s meal” that comes with a ciggie. Go for Girls and Gays night each Thursday, and get $12 martinis.","disambiguatingDescription":"Best Gay-Friendly Straight Bar, The Best of Big D 2026"}},{"@type":"ListItem","position":178,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-pogos-wine-spirits","name":"Pogo's Wine \u0026 Spirits","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-pogos-wine-spirits","description":"We have a friend whose Indian-born wife craves an Indian gin that practically no one in the United States has heard of. Our friend asked the fine folks at Pogo’s if they could find it for his wife’s birthday. Of course they could. GM Courtney Luscher and her staffare tops.","disambiguatingDescription":"Best Place to Buy Booze, The Best of Big D 2026"}},{"@type":"ListItem","position":179,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-katy-trail-ice-house","name":"Katy Trail Ice House","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-katy-trail-ice-house","description":"It bears repeating: 27,000 square feet; 30 mature live oaks; a Texas country playlist built by a human, not an algorithm; servers schlepping impossible pyramids of frosty beer schooners; and the one thing that no other patio has: scantily clad gals and shirtless guys parading by on the Katy Trail. Eyes peeled for Troy Aikman.","disambiguatingDescription":"Best Bar Patio, The Best of Big D 2026"}},{"@type":"ListItem","position":180,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-shyboy-hi-fi","name":"Shyboy Hi-Fi","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-shyboy-hi-fi","description":"In this subterranean audiophile haven, DJs spin vinyl with pure haki , and the beat pounds your chest before it hits your ears, thanks to the custom OJAS sound systems. Sip a highball and have a soft serve in the cerulean, velveteen vault, or hit the dance floor and bow to the bass.","disambiguatingDescription":"Best Hi-Fi Bar, The Best of Big D 2026","sameAs":"https://instagram.com/shyboy.hifi"}}]},{"@type":"Event","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#party","name":"The Best of Big D Party","url":"https://www.dmagazine.com/awards_and_events/best-of-big-d-2026_event/","description":"Celebrate this year’s Best of Big D winners in person. 21+ only. VIP ($150) is 6–7 p.m. with early entry and first access to food, drinks and priority bar service; General Admission ($95) is 7–10 p.m. and includes a one-year subscription to D Magazine.","startDate":"2026-12-03T18:00:00-06:00","endDate":"2026-12-03T22:00:00-06:00","eventStatus":"https://schema.org/EventScheduled","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","typicalAgeRange":"21-","location":{"@type":"Place","name":"Astoria Event Venue"},"organizer":{"@id":"https://www.dmagazine.com/#organization"},"offers":[{"@type":"Offer","name":"VIP","description":"6–7 p.m. VIP tickets include everything in General Admission plus early entry, first access to all food and drinks, priority bar service throughout the night, and access to exclusive VIP activations and experiences.","price":"150","priceCurrency":"USD","url":"https://www.dmagazine.com/awards_and_events/best-of-big-d-2026_event/","availability":"https://schema.org/InStock"},{"@type":"Offer","name":"General Admission","description":"7–10 p.m. General Admission gives you a taste of the full deck, from food and drinks to shopping, entertainment and immersive experiences, plus a one-year subscription to D Magazine.","price":"95","priceCurrency":"USD","url":"https://www.dmagazine.com/awards_and_events/best-of-big-d-2026_event/","availability":"https://schema.org/InStock"}]}]}</script>
