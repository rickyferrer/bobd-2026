<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","@id":"https://www.dmagazine.com/#organization","name":"D Magazine","url":"https://www.dmagazine.com/"},{"@type":"CollectionPage","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#webpage","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/","name":"The Best of Big D 2026: all 180 winners","description":"D Magazine’s Best of Big D 2026: 180 winners across Culture, Food \u0026 Dining, Shopping \u0026 Services, and Drinks \u0026 Nightlife, dealt as an interactive deck of cards.","inLanguage":"en-US","datePublished":"2026-11-23","publisher":{"@id":"https://www.dmagazine.com/#organization"},"mainEntity":{"@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#winners"},"about":{"@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#party"}},{"@type":"ItemList","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#winners","name":"The Best of Big D 2026: all winners","description":"Every winner in D Magazine’s Best of Big D 2026, across Culture, Food \u0026 Dining, Shopping \u0026 Services, and Drinks \u0026 Nightlife.","numberOfItems":180,"itemListOrder":"https://schema.org/ItemListUnordered","itemListElement":[{"@type":"ListItem","position":1,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-earth-to-alena","name":"Earth to Alena","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-earth-to-alena","description":"Alena Niehaus’ Instagram feed isn’t just ASMR; it’s a way to learn more about Dallas. The urban artist takes her sketchbook to some of the most iconic (or underappreciated) spots in the city, telling their stories as she sketches them. Learn about the Filter Building, Sons of Hermann Hall, and Garland’s only museum.","disambiguatingDescription":"Best Instagram Feed, The Best of Big D 2026","sameAs":"https://instagram.com/earthtoalena"}},{"@type":"ListItem","position":2,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-turtle-creek-chorale","name":"Turtle Creek Chorale","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-turtle-creek-chorale","description":"From their start in 1980 as 30 men singing at Holy Trinity Catholic Church, the chorus has grown into a 250-member ensemble that continues to dazzle audiences. Today, the primarily gay male chorus boasts more than 38 albums and two documentaries, including one Emmy win.","disambiguatingDescription":"Best Choral Group, The Best of Big D 2026","sameAs":"https://turtlecreekchorale.com"}},{"@type":"ListItem","position":3,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dallas-museum-of-natural-historys-wildlife-dioramas","name":"Dallas Museum of Natural History's Wildlife Dioramas","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dallas-museum-of-natural-historys-wildlife-dioramas","description":"The wildlife dioramas at the former Dallas Museum of Natural History were stored away when the museum closed in 2012. But just in time for FIFA Fan Fest in Fair Park, the detailed habitat exhibits, as haunting and bizarre as good dioramas should be, reappeared for the world’s visitors and remained up through September.","disambiguatingDescription":"Best Non-Art Museum Exhibition, The Best of Big D 2026"}},{"@type":"ListItem","position":4,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-don-carlo-dallas-opera","name":"Don Carlo, Dallas Opera","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-don-carlo-dallas-opera","description":"When the Dallas Opera’s lead in Don Carlo was taken down by allergies, opera staffhad mere hours to find a substitute. Singer Arturo Chacón Cruz flew in from Miami with minutes to spare and brought true beauty despite walking onstage without any rehearsal—an all-around effort that earns a bravo.","disambiguatingDescription":"Best Production, The Best of Big D 2026"}},{"@type":"ListItem","position":5,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-lab-report","name":"The Lab Report","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-lab-report","description":"This nonprofit newsroom celebrated its first birthday in July, and in that year the team— which consists of D Magazine alum Matt Goodman and former Dallas Morning News reporters Sharon Grigsby, Kelli Smith, and Claire Ballor—has covered our city’s broken foster care system with unmatched rigor.","disambiguatingDescription":"Best News Outlet, The Best of Big D 2026","sameAs":"https://labreportdallas.com"}},{"@type":"ListItem","position":6,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-jambaloo","name":"Jambaloo","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-jambaloo","description":"What do two lawyers have to do with raising up local music talent? Joe Morrison and Shane Mullen of law firm Mullen \u0026 Mullen wanted to do more with their money, so they launched the free, weeklong Jambaloo music festival which fills venues from Deep Ellum to Fort Worth, and added a music prize that gives an up-and-comer a $20,000 boost.","disambiguatingDescription":"Best Arts Incubator, The Best of Big D 2026","sameAs":"https://jambaloo.live"}},{"@type":"ListItem","position":7,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-zachary-j-willis","name":"Zachary J. Willis","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-zachary-j-willis","description":"Willis has been a member of Dallas Theater Center’s resident acting company since 2021, stealing scenes with his emotional depth, clear tenor, and impeccable comedic timing. Whether playing the lead in Joseph and the Amazing Technicolor Dreamcoat or a supporting role in AChristmas Carol , Willis is guaranteed to captivate.","disambiguatingDescription":"Best Actor, The Best of Big D 2026"}},{"@type":"ListItem","position":8,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-lights-at-interlochen","name":"The Lights at Interlochen","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-lights-at-interlochen","description":"Last December marked the 50th year that homeowners in Arlington’s Interlochen neighborhood prepared light displays so over the top that families from far and wide drove in by the carload to see them. Once ranked on People magazine’s list of top 10 Christmas light displays, the free event lasts for two weeks and ends on Christmas Day.","disambiguatingDescription":"Best Holiday Lights Display, The Best of Big D 2026"}},{"@type":"ListItem","position":9,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-titas-dance-unbound","name":"TITAS/Dance Unbound","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-titas-dance-unbound","description":"Since its founding in 1982, the Texas International Theatrical Arts Society has brought Mikhail Baryshnikov, the Alvin Ailey American Dance Theater, MOMIX, STOMP, and more massive names in the dance world to Dallas. But somehow, its progressive programming remains an insider Arts District secret.","disambiguatingDescription":"Best Dance Presenter, The Best of Big D 2026","sameAs":"https://titas.org"}},{"@type":"ListItem","position":10,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-stage-west-theatre","name":"Stage West Theatre","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-stage-west-theatre","description":"What began in 1979 as a storefront theater next to a downtown Fort Worth sandwich shop has grown into a theatrical force off Vickery Boulevard known for productions that both comfort and challenge. Yes, it’s worth the long drive west, especially if you’re dining in the Lobby Café before curtain.","disambiguatingDescription":"Best Theater Company, The Best of Big D 2026"}},{"@type":"ListItem","position":11,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-outside-the-adolphus","name":"Outside the Adolphus","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-outside-the-adolphus","description":"For princes: book a room at the Adolphus for a breakfast buffet and bleacher seating. For paupers: arrive in pre dawn hours to unfold your chairs on the south side of Commerce, across from the legendary hotel. Either way, you’ll get to see every televised performance before popping into the hotel lobby for an after-party.","disambiguatingDescription":"Best Place to Watch the Dallas Holiday Parade, The Best of Big D 2026"}},{"@type":"ListItem","position":12,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-happiness-anytime-leon-bridges","name":"Happiness Anytime, Leon Bridges","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-happiness-anytime-leon-bridges","description":"Fort Worth’s Leon Bridges was on our list of 25 Most Influential Recording Artists, and his new album has only added to his artistic weight. Happiness Anytime is a collaboration with Brits Josh Lloyd-Watson and Lydia Kitto of Jungle and blends Bridges’ signature soulful style with a danceable mix of Afrobeat, Brazilian grooves, and disco.","disambiguatingDescription":"Best Album, The Best of Big D 2026"}},{"@type":"ListItem","position":13,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-kristen-lazarchick","name":"Kristen Lazarchick","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-kristen-lazarchick","description":"A kidnapped woman who’s possibly possessed. Lewis Carroll’s iconic White Rabbit. A flighty flapper entangled in a love... hexagon? All in a season’s work for Lazarchick, who is also an artistic associate at Second Thought Theatre. With a résumé so varied, the girl next door has proven she’s anything but predictable.","disambiguatingDescription":"Best Actress, The Best of Big D 2026"}},{"@type":"ListItem","position":14,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-city-rink-at-main-street-garden-park","name":"City Rink at Main Street Garden Park","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-city-rink-at-main-street-garden-park","description":"Downtown Dallas Inc. and CultureMap paired up to drop a temporary ice skating rink in Main Street Garden Park during the holiday season. While the weather wasn’t always cold (hello, 80-degree Christmas), the chance to hit the ice downtown, surrounded by high-rises, still made for core-memory moments.","disambiguatingDescription":"Best Holiday Pop-Up, The Best of Big D 2026","sameAs":"https://cityrink.culturemap.com"}},{"@type":"ListItem","position":15,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-vonda-k-bowling","name":"Vonda K. Bowling","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-vonda-k-bowling","description":"Music directors are often the unsung heroes, but Bowling has been making everything from Assassins to Waitress sound its best at theaters all over town for the past two decades. Whether she’s wielding a baton or tickling the ivories, conducting the choir or leading the band, Bowling deserves a standing O.","disambiguatingDescription":"Best Music Director, The Best of Big D 2026"}},{"@type":"ListItem","position":16,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-klyde-warren-park","name":"Klyde Warren Park","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-klyde-warren-park","description":"If you visited the downtown park during any World Cup game, you found a mix of fans in, say, Argentine and Egyptian jerseys, slapping tables and cheering the game playing on a massive screen as kids ran between the playground and splash pad. If bringing all kinds together is a park’s goal, this one wins.","disambiguatingDescription":"Best Family Attraction, The Best of Big D 2026"}},{"@type":"ListItem","position":17,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cinemark-dallas-xd-and-imax","name":"Cinemark Dallas XD and IMAX","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cinemark-dallas-xd-and-imax","description":"Months after The Odyssey’ s release, this North Dallas multishowings in its IMAX 70 mm theater, a format that allows larger, clearer images, literally showing audiences more of the film. Only about 25 theaters in the nation are equipped with this tech. It’s an experience worth planning ahead for.","disambiguatingDescription":"Best Movie Theater, The Best of Big D 2026"}},{"@type":"ListItem","position":18,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-ok2bx","name":"OK2BX","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-ok2bx","description":"OK2BX (“OK to be extraordinary”) allows student filmmakers from around the globe to show their work on the big screen, often for the first time ever. Founded in 2021 by Brent and Chris Bolding to honor their daughter who died by suicide after coming out as trans, the fest celebrates the creative visionaries of our future.","disambiguatingDescription":"Best Mission-Driven Film Festival, The Best of Big D 2026","sameAs":"https://ok2bx.org"}},{"@type":"ListItem","position":19,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-spazio-morandi","name":"Spazio Morandi","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-spazio-morandi","description":"After a decade away, gallerist Wanda Dye returned to Dallas this year and opened a collaborative space in East Dallas with designer Stefania Morandi. The gallery is guided by an oldschool manifesto, including the tenet to “democratize collecting” with work by art stars of the local scene, sold at affordable prices.","disambiguatingDescription":"Best New Gallery, The Best of Big D 2026"}},{"@type":"ListItem","position":20,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-killer-whale","name":"“Killer Whale”","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-killer-whale","description":"It ignited an outsize outrage when one of mural artist Robert Wyland’s Whaling Walls, which had been on display in downtown Dallas since 1999, was covered in bright blue paint to make space for a FIFA ad. But then a tiny new addition in one corner, thanks to an anonymous graffiti writer who spraypainted a killer whale, so labeled, helped put everything back in perspective. Who says civil discourse is dead?","disambiguatingDescription":"Best Graffiti, The Best of Big D 2026"}},{"@type":"ListItem","position":21,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tureen","name":"Tureen","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tureen","description":"Since 2023, Tureen has quietly crafted a refined, ambitious program in Oak Cliff. Highlighting under-the-radar artists, the gallery keeps a special focus on queer and Indigenous makers, such as museum darling Sonya Kelliher-Combs, who has shown at the Whitney. Tureen’s Cody Fitzsimmons and Christopher Scott also promote their Dallas project at art fairs around the country.","disambiguatingDescription":"Best Gallery, The Best of Big D 2026"}},{"@type":"ListItem","position":22,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-grandscape","name":"Grandscape","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-grandscape","description":"It’s tempting to think that The Colony’s mega entertainment complex, anchored by Nebraska Furniture Mart and a Ferris wheel, is not for you. But then you’ll see a concert at Windmills, do a sauna circuit at WorldSprings, watch a basketball game at Cosm, and realize it’s Warren Buffett’s world, baby.","disambiguatingDescription":"Best Suburban Project, The Best of Big D 2026"}},{"@type":"ListItem","position":23,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-chateau-show","name":"Chateau Show","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-chateau-show","description":"In an unlikely collaboration between artists and a medical foundation, this annual show takes place in a Swiss Avenue mansion, the Historic Aldredge House Museum. Organizer-artists Joel Murray, who is also the house’s caretaker, and Clint Bargers founded the project in 2022, inviting artists to site works within the house for a much-anticipated, one-weekend-only experience each fall.","disambiguatingDescription":"Best Annual Exhibition, The Best of Big D 2026","sameAs":"https://instagram.com/chateau_show"}},{"@type":"ListItem","position":24,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-harky-diml","name":"Harky.Diml","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-harky-diml","description":"You’re at your wit’s end after having been served yet another Alo-clad influencer talking about the hottest restaurant in Dallas. Then the algorithm throws you a bone and serves up Michael Harky, living his deeply normal 9-to-5 life out loud. Even Noah Kahan once commented, “God damn right.”","disambiguatingDescription":"Best TikToker, The Best of Big D 2026","sameAs":"https://instagram.com/harky.diml"}},{"@type":"ListItem","position":25,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tessa-granowski","name":"Tessa Granowski","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tessa-granowski","description":"After running gallery spaces elsewhere, Dallas native Tessa Granowski returned to the city two years ago to open Nature of Things, a nomadic gallery. As part of her excellent programming, she has been spotlighting little-known or forgotten lore about Texan artists, musicians, and writers. As Larry McMurtry said: “Texas is rich in unredeemed dreams.”","disambiguatingDescription":"Best Texan Art-Lore Champion, The Best of Big D 2026","sameAs":"https://natureofthings.xyz"}},{"@type":"ListItem","position":26,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-jaclyn-le-studio","name":"Jaclyn Le Studio","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-jaclyn-le-studio","description":"You’ve probably seen Le’s work around town. Her hand has touched Meridian, Bar Sardine, and countless other walls and windows, leaving behind impossibly straight lines, large-scale murals, or intricate gold-leaf lettering. The videos of her process are mesmerizing.","disambiguatingDescription":"Best Hand-Lettering, The Best of Big D 2026","sameAs":"https://instagram.com/jaclynlestudio"}},{"@type":"ListItem","position":27,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dallas-stadium","name":"Dallas Stadium","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dallas-stadium","description":"Step 1: rename AT\u0026T Stadium for the World Cup. Step 2: slap badly needed curtains over the windows on the west end. (Take notes, Jerry Jones.) Step 3: replace the turf with gorgeous natural grass. Step 4: bring in the rowdiest fans from across the globe, and throw the year’s best sports party.","disambiguatingDescription":"Best Rebranded Sports Venue, The Best of Big D 2026"}},{"@type":"ListItem","position":28,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dallas-art-book-fair","name":"Dallas Art Book Fair","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dallas-art-book-fair","description":"What began as a small zine fest at Dallas Contemporary, in 2022, has grown into a dynamic celebration of art and printed matter. Founded by tattoo artist and illustrator Gino Dal Cin, who also serves as the director of operations at DC, this free multiday event brings together publishers, writers, artists, and speakers to champion books as curatorial spaces.","disambiguatingDescription":"Best Museum Program, The Best of Big D 2026"}},{"@type":"ListItem","position":29,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-sole-to-sole","name":"Sole to Sole","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-sole-to-sole","description":"Sure, the event is a place to buy, sell, and trade sought-after kicks, vintage tees, and locally branded stoner’s kits and hoodies. But more than that, it’s a place where sneakerheads and streetwear enthusiasts can gather as a community—with a DJ spinning, naturally.","disambiguatingDescription":"Best Sneaker Church, The Best of Big D 2026","sameAs":"https://soletosole.com"}},{"@type":"ListItem","position":30,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-jared-sandler-texas-rangers","name":"Jared Sandler, Texas Rangers","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-jared-sandler-texas-rangers","description":"The 37-year-old is legend Eric Nadel’s heir apparent as the voice of the Rangers. He’s as versatile as it gets, bouncing from radio to television to the internet, and as liable to drop obscure stats on social media as line dance with cheerleaders on the dugout roof.","disambiguatingDescription":"Best Sportscaster, The Best of Big D 2026"}},{"@type":"ListItem","position":31,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-montana-700","name":"Montana 700","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-montana-700","description":"Tony McDowell, an Oak Cliffnative, has outworked the local competition, releasing 48 studio tracks in the last 18 months. He credits that work ethic to his mother, Sadetra, who had successful hairstyling businesses in Dallas and Houston. Only fitting, then, that his latest record, the 17-track Sadetra Son , is a tribute to her.","disambiguatingDescription":"Best Rapper, The Best of Big D 2026"}},{"@type":"ListItem","position":32,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-halperin-park","name":"Halperin Park","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-halperin-park","description":"Just as Klyde Warren Park was built over Woodall Rodgers to bridge Uptown and downtown, this $300 million, 5-acre deck park connects parts of South Dallas and Oak Cliffthat were divided by I-35 in the 1950s. Already it bustles with yoga, food fests, and a bevy of parent-and-baby classes.","disambiguatingDescription":"Best New Dallas Park, The Best of Big D 2026"}},{"@type":"ListItem","position":33,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cooper-flagg","name":"Cooper Flagg","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cooper-flagg","description":"It’s impressive enough that the 19-yearold from Maine became the first rookie since Michael Jordan to lead his team in points, rebounds, assists, and steals. That he did so while restoring hope to Mavs fans heartbroken from losing Luka Dončić is miraculous. He is Dallas’ next sports icon.","disambiguatingDescription":"Best Athlete Newcomer, The Best of Big D 2026"}},{"@type":"ListItem","position":34,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-lone-star-circus","name":"Lone Star Circus","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-lone-star-circus","description":"When Fanny Kerwich, an eighthgeneration French circus performer, fell head over heels for a Dallas lawyer while she was touring with Barnum, her beau vowed to run away with her. Instead, Kerwich planted roots and set up her own big top in Dallas in 2006, recruiting and nurturing jaw-dropping acrobats, jugglers, clowns, and aerialists ever since.","disambiguatingDescription":"Best Family Entertainment, The Best of Big D 2026","sameAs":"https://lonestarcircus.com"}},{"@type":"ListItem","position":35,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-power-station","name":"The Power Station","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-power-station","description":"The Kim Gordon of Dallas art institutions, The Power Station celebrates 15 years as the most discordant, rule-breaking exhibition space in town. With a mission to show challenging exhibitions with international and regional artists, this art space offers many things: awe, confusion, and sometimes wet shoes or ringing ears, but always discovery.","disambiguatingDescription":"Best Nonprofit Art Space, The Best of Big D 2026"}},{"@type":"ListItem","position":36,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-musers-the-podcast-ktck","name":"The Musers the Podcast, KTCK","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-musers-the-podcast-ktck","description":"The trio that has done The Ticket’s morning radio show for 30 years— George “Jub Jub” Dunham, Craig “Junior” Miller, and Gordon “No Pants” Keith—are Texas Radio Hall of Famers and national Marconi winners. They launched this podcast last year because they are … hot dog?","disambiguatingDescription":"Best Podcast, The Best of Big D 2026"}},{"@type":"ListItem","position":37,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-stephanie-elizalde","name":"Stephanie Elizalde","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-stephanie-elizalde","description":"The TEA has taken over seven districts. Meanwhile, Dallas ISD has momentum. That’s due in large part to the superintendent. She is adept at placing the right people in the right roles to improve outcomes. That comes from walking halls and talking to teachers and principals, not just sitting in her office.","disambiguatingDescription":"Best Public Official, The Best of Big D 2026"}},{"@type":"ListItem","position":38,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-booker-t-washingtons-flying-horse-festival","name":"Booker T. Washington's Flying Horse Festival","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-booker-t-washingtons-flying-horse-festival","description":"This school year, Booker T. celebrates 50 years since desegregation led to its transformation into what is now one of the most renowned arts magnets in the country. The Flyinghorse Festival showcases students’ exceptional talent while raising funds for kids who can’t afford cellos and other tools of the trade. Take tissues.","disambiguatingDescription":"Best Fundraiser, The Best of Big D 2026","sameAs":"https://bookertflyinghorse.com"}},{"@type":"ListItem","position":39,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-ntx-now-kera","name":"NTX Now, KERA","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-ntx-now-kera","description":"Every weekday morning at 9 people who genuinely seem to enjoy each other, Ron Corning and Miranda Suarez, spend an hour talking about local new s and interviewing the people who make it. It’s a welcome salve on the wound c reated by Krys Boyd (und erstandably) thinking more about national topics.","disambiguatingDescription":"Best Radio Show, The Best of Big D 2026"}},{"@type":"ListItem","position":40,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-meteor","name":"The Meteor","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-meteor","description":"If you own a five-figure bicycle and have thighs like watermelons and wear only Rapha kits and ride at a 25 mph pace, then their Saturday ride is your ride. Plus Meteor is a great bike shop (it’s a Canyon Experience Partner), and they serve strong espresso and tasty sourdough pizza.","disambiguatingDescription":"Best Group Bike Ride, The Best of Big D 2026"}},{"@type":"ListItem","position":41,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-paige-bueckers","name":"Paige Bueckers","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-paige-bueckers","description":"No player, ever, has scored more points in her first two WNBA seasons. And no Dallas Wing, ever, has been a bigger boon to team business. She isn’t just the best athlete in town. She might be the most important, too.","disambiguatingDescription":"Best Athlete, The Best of Big D 2026"}},{"@type":"ListItem","position":42,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-founders-plaza-at-dfw-airport","name":"Founders' Plaza at DFW Airport","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-founders-plaza-at-dfw-airport","description":"It’s stunning to get this close to commercial jets as they land and take off. Plus the park’s speakers broadcast comms between pilots and air traffic control. On a recent morning, the woman controller greeted every arriving pilot with a cheer that made it sound like they were a family member arriving in her kitchen for breakfast.","disambiguatingDescription":"Best Jet Park, The Best of Big D 2026"}},{"@type":"ListItem","position":43,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-deep-vellum-music-literature-festival","name":"Deep Vellum Music \u0026 Literature Festival","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-deep-vellum-music-literature-festival","description":"The inaugural event, in July, in Deep Ellum, featured headliners Hanif Abdurraqib ( New York Times bestseller, long-listed for National Book Award in nonfiction) and Jamila Woods ( NPR’s Tiny Desk, CBS This Morning, The Late Show with Stephen Colbert ). Each gig was well attended and thoughtprovoking. More, please.","disambiguatingDescription":"Best Literary Festival, The Best of Big D 2026"}},{"@type":"ListItem","position":44,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dallas-wings","name":"Dallas Wings","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dallas-wings","description":"The Wings didn’t climb out of the WNBA cellar so much as explode out of it, setting a record for the league’s largest single-season turnaround. Paige Bueckers gets the bulk of the credit, but Dallas isn’t playoffbound without WNBA Most Improved Player Jessica Shepard and the returning Awak Kuier.","disambiguatingDescription":"Best Team, The Best of Big D 2026"}},{"@type":"ListItem","position":45,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-rhett-lashlee-smu-football","name":"Rhett Lashlee, SMU Football","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-rhett-lashlee-smu-football","description":"No matter what the Mustangs’ final record reads, 2026 is but another chapter in Lashlee’s five-season revival of SMU football, which includes the best three-year stretch in program history and the Mustangs’ first College Football Playoffappearance. Lashlee’s next task? Find a successor to Kevin Jennings, SMU’s greatest quarterback.","disambiguatingDescription":"Best Coach, The Best of Big D 2026"}},{"@type":"ListItem","position":46,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-ryan-bingham","name":"Ryan Bingham","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-ryan-bingham","description":"After a seven-year album drought, Ryan Bingham is having fun again. The depression and pain that most fans came to know him by from Crazy Heart has lifted. What’s left is a completely unlocked playbook thanks to his new partnership with The Texas Gentlemen.","disambiguatingDescription":"Best Country Artist, The Best of Big D 2026"}},{"@type":"ListItem","position":47,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-good-local-markets-at-fair-park","name":"Good Local Markets at Fair Park","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-good-local-markets-at-fair-park","description":"Good Local Markets made its name in East Dallas but reached new heights after opening an outpost in Fair Park, smack in the middle of a food desert. The market brings in goods sourced within 150 miles and is also SNAPand WIC-certified, so South Dallas locals can purchase farm-fresh food in the spring and summer. Free parking at Gate 6.","disambiguatingDescription":"Best Farmers Market, The Best of Big D 2026"}},{"@type":"ListItem","position":48,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-fruteria-mango","name":"Fruteria Mango","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-fruteria-mango","description":"Whether it’s their mini pancakes with ice cream and chocolate drizzle or a Taki crumb-coated elote, you’ll always be shocked (in a good way) by the generous toppings. Even more surprising is how they manage to pack so much freshly sliced mango into a cup.","disambiguatingDescription":"Best Fruteria, The Best of Big D 2026"}},{"@type":"ListItem","position":49,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-fruti-paleteria","name":"Fruti Paleteria","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-fruti-paleteria","description":"We especially love Fruti’s dairy- based options such as the strawberries- andcream paleta—not overly sweet and even better when dipped in chocolate and rolled in nuts, something they’ll do with any of their pops.","disambiguatingDescription":"Best Paletas, The Best of Big D 2026"}},{"@type":"ListItem","position":50,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-bresnan-bread-and-pastry","name":"Bresnan Bread and Pastry","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-bresnan-bread-and-pastry","description":"There’s something for everyone at this McKinney institution, from fluffy bacon-cheddar scones to sticky-sweet kouign amann. Sourdough loaves look straight from the textbook, and Bresnan even bakes pizza by the slice. If you don’t want to drive north, they also sell at the Saint Michael’s Farmers Market.","disambiguatingDescription":"Best Bakery, The Best of Big D 2026"}},{"@type":"ListItem","position":51,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-starship-bagel","name":"Starship Bagel","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-starship-bagel","description":"Starship is becoming an ambassador for Dallas culture, taking its bagels to festivals in New York and winning awards against the East Coast’s finest. Its downtown location, next to the Giant Eyeball, is on many a tourist’s agenda. Seasonal specials keep getting more creative, too.","disambiguatingDescription":"Best Bagels, The Best of Big D 2026"}},{"@type":"ListItem","position":52,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mr-banh-mi","name":"Mr. Bánh Mì","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mr-banh-mi","description":"Fresh bread comes straight out of the oven at this Frisco bakery, and the crusty bread is the hero of the sandwich. The cold cut combination, loaded up with pâté and fresh veggies, is an ideal lunch for Texas summers and picnic weather alike.","disambiguatingDescription":"Best Bánh Mì, The Best of Big D 2026"}},{"@type":"ListItem","position":53,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-sister","name":"Sister","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-sister","description":"The joy of a girl dinner is the spontaneity of building a haphazard plate. Slide into a bubblegum pink banquette, and let the staffhelp you and your gals (or snack-loving guys) put together a delightfully random spread. Sure bets: thick za’atar focaccia, in-house pastas, wagyu short rib, and chile-garlic broccoli.","disambiguatingDescription":"Best Girl Dinner, The Best of Big D 2026"}},{"@type":"ListItem","position":54,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-pho-xom","name":"Pho Xom","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-pho-xom","description":"Pho tai lan, a Northern Vietnamese specialty featuring a bounty of garlic and scallions, is the house favorite here. Pho Xom’s broths are deceptively simple and reflect hours of love in the kitchen. No wonder locals have taken to calling it “pho for purists.”","disambiguatingDescription":"Best Vietnamese, The Best of Big D 2026"}},{"@type":"ListItem","position":55,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-weinbergers-deli","name":"Weinberger's Deli","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-weinbergers-deli","description":"The Grapevine institution is better than ever, with an expanded dining room that can finally accommodate its loyal followers. With a sandwich menu this long—more than 70 temptations—you should plan before you order. Chicago, New York, and Philly specialties are represented, along with Weinberger’s own indulgent inventions.","disambiguatingDescription":"Best Deli, The Best of Big D 2026"}},{"@type":"ListItem","position":56,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dragon-casa","name":"Dragon Casa","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-dragon-casa","description":"Filling dumpling wrappers with lamb birria is one of the many clever ideas at this ChineseMexican kitchen. The birria broth takes the place of the soup stock inside Chinese xiao long bao, adding a strong punch of fusion flavor. Order the “dumpling fiesta,” and your crispy pan-fried treats will arrive coated in a spicy dry rub.","disambiguatingDescription":"Best Dumplings, The Best of Big D 2026"}},{"@type":"ListItem","position":57,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-lucia","name":"Lucia","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-lucia","description":"The spirit of Italian cooking—seasonality, fresh produce, a bit of improvisation—is the guiding philosophy here. Pastas are always exemplary. If you don’t believe us, ask the hundreds of regulars who’ve helped keep Lucia thriving for 16 years.","disambiguatingDescription":"Best Italian, The Best of Big D 2026"}},{"@type":"ListItem","position":58,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-bharat-bhavan","name":"Bharat Bhavan","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-bharat-bhavan","description":"This minichain with locations in Frisco and Irving claims to have some of the largest all-vegetarian dining rooms in the world. Everything on the enormous menu is worth ordering, and if decision fatigue strikes, the helpful staffwill offer recommendations. Rare specialty dosas and shikampuri (edamame) kebabs are highlights.","disambiguatingDescription":"Best Indian, The Best of Big D 2026"}},{"@type":"ListItem","position":59,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mr-max","name":"Mr Max","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mr-max","description":"This izakaya is so traditional and so beloved by Japanese expats that it can be hard to snag a seat. Sit at the bar and order drinking snacks, or take offyour shoes and sit on one of the floor cushions for a cozy group meal. Save room for green tea ice cream.","disambiguatingDescription":"Best Japanese, The Best of Big D 2026"}},{"@type":"ListItem","position":60,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-uptown-dumpling","name":"Uptown Dumpling","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-uptown-dumpling","description":"This newcomer brings glamour, a prestigious background (the chef was a UNESCO culinary ambassador), and superb dumplings. (Get the ultraflavorful green pepper xiao long bao.) Specialties from Shanghai and Taiwan appear next to top-quality teas, a blessing for city dwellers who often have to drive to the ’burbs for authentic Chinese cuisine.","disambiguatingDescription":"Best Chinese, The Best of Big D 2026"}},{"@type":"ListItem","position":61,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-ichigoh-ramen-lounge","name":"Ichigoh Ramen Lounge","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-ichigoh-ramen-lounge","description":"Ichigoh has won this category for years on end despite a wave of competition. The ramen broths are always seasoned and balanced just right, and monthly specials keep the menu fresh. In summer, stay cool by going brothless.","disambiguatingDescription":"Best Ramen, The Best of Big D 2026"}},{"@type":"ListItem","position":62,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-kessler-baking-studio","name":"Kessler Baking Studio","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-kessler-baking-studio","description":"A wise person once said that cookies are all about texture: getting those crispy, golden edges without sacrificing a gooey center. Nobody hits that note better than means there’s a treat for everyone’s taste. Leftover cookies are repurposed into world-class biscotti.","disambiguatingDescription":"Best Cookies, The Best of Big D 2026"}},{"@type":"ListItem","position":63,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-bread-club","name":"The Bread Club","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-bread-club","description":"Their dreamy sesame-coated baguettes are the ideal accompaniment for a charcuterie-and-cheese night. The real gem, though, is sprouted quinoa loaf, which tastes like a nuttier, more flavorful version of whole wheat bread. Can’t decide? Sit down for a sandwich before you shop.","disambiguatingDescription":"Best Bakery for Bread, The Best of Big D 2026"}},{"@type":"ListItem","position":64,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-thunderbird-pies","name":"Thunderbird Pies","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-thunderbird-pies","description":"What was once a Detroit-style specialist is now a triple threat in East Dallas. Thunderbird still has its mighty Detroit pies, but if you want a thinner crust, you can also indulge in the city’s best New York-style pizza or a thin-and-crispy version that hails from the taverns of Massachusetts.","disambiguatingDescription":"Best Pizza, The Best of Big D 2026"}},{"@type":"ListItem","position":65,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-yard","name":"The Yard","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-yard","description":"Name a restaurant after its patio, and you’d better deliver the square footage. The Yard, situated on an acre in downtown McKinney, does not disappoint. A canopy of oak trees supplies shade, and the 1,000-foot wraparound porch frames a historic home that dates back to 1878.","disambiguatingDescription":"Best Restaurant Patio, The Best of Big D 2026"}},{"@type":"ListItem","position":66,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-daq-korean-style-cuisine-chicken","name":"DAQ Korean Style Cuisine \u0026 Chicken","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-daq-korean-style-cuisine-chicken","description":"This well-rounded casual restaurant can fry a scrumptious piece of chicken, make a traditional shrimp pancake or fried rice bowl, and assemble some cheerfully unhealthy bar snacks. Most importantly, though, you can sample some of everything by taking advantage of three- and four-dish combo pricing.","disambiguatingDescription":"Best Korean, The Best of Big D 2026"}},{"@type":"ListItem","position":67,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tango-room","name":"Tango Room","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tango-room","description":"The Lemon is a brilliant trick, a confection of white chocolate and lemon mousse, encased in a white chocolate shell that’s painted bright yellow and molded in the convincing shape of the yellow citrus fruit, complete with pedicel. If that sounds too fancy, dark chocolate cake is so fudgy that it’s practically molten.","disambiguatingDescription":"Best Place for Dessert, The Best of Big D 2026"}},{"@type":"ListItem","position":68,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-fonds-fish-sandwich","name":"Fond's Fish Sandwich","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-fonds-fish-sandwich","description":"Mark your calendars, folks. This limited-run tribute to fast-food fish sandwiches is a Fond staple during Lent, and it makes very rare appearances the rest of the year. The kitchen fries thick sablefish fillets just right and bakes its own Japanese milk buns. It’s worth planning your year around.","disambiguatingDescription":"Best Sandwich, The Best of Big D 2026"}},{"@type":"ListItem","position":69,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-clo9ud-cafe","name":"CLO9UD Cafe","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-clo9ud-cafe","description":"From a humble truck parked east of Fair Park, sisters Gigi and Lenny Gomez Umanzor are quietly making a statement in Dallas’ booming matcha scene. The flavor of the ceremonial-grade green tea shines, and it can be further enhanced with seasonal additions. The sisters also offer creative takes on coffee standards and “refreshers,” from a lychee and strawberry Berry Bliss to a Minty Mara with mango and passion fruit.","disambiguatingDescription":"Best Matcha, The Best of Big D 2026"}},{"@type":"ListItem","position":70,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-noorsha","name":"Noorsha","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-noorsha","description":"The Turkish bakery expanded from an original standing-room-only commercial location into a thriving cafe and tea room. Order baklava at the counter, or sit at a table and watch the bakers at work through a window. A huge variety of flatbreads and pastries is all made from scratch.","disambiguatingDescription":"Best Mediterranean, The Best of Big D 2026"}},{"@type":"ListItem","position":71,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-green-point-seafood-and-oyster-bar","name":"Green Point Seafood and Oyster Bar","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-green-point-seafood-and-oyster-bar","description":"This is the kind of neighborhood restaurant that’s easy to dress up or down to any occasion. A quick, casual lunch over a bowl of chowder will be just as satisfying as dinner seafood towers, cioppino, and blackened redfish. Mini fish sandwiches make an extra-fun appetizer.","disambiguatingDescription":"Best Seafood, The Best of Big D 2026"}},{"@type":"ListItem","position":72,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-puerto-cocina-bar","name":"Puerto Cocina \u0026 Bar","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-puerto-cocina-bar","description":"Mexican seafood is the specialty here, where chef Anastacia Quiñones- Pittman pays a sophisticated tribute to Baja’s bounty. Be sure to order some of the one- or two-bite appetizer snacks, adventurous creations that might be miniature tuna-caviar tarts, a single butter-poached scallop, or a crispy ceviche taquito.","disambiguatingDescription":"Best Mexican, The Best of Big D 2026"}},{"@type":"ListItem","position":73,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-charles","name":"The Charles","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-charles","description":"A new remodel has left The Charles darker, moodier, and more sophisticatedlooking than ever before. The kitchen has more swagger in its step, too. Dig into the Italy-focused wine list, celebrate with snow crab ravioli, and finish your night in the more private backroom bar.","disambiguatingDescription":"Best Place to Celebrate an Anniversary, The Best of Big D 2026"}},{"@type":"ListItem","position":74,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-pangea","name":"Pangea","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-pangea","description":"Chef Kevin Ashade tells stories from the entire African diaspora at this downtown restaurant, which features spices and dishes from Jamaica, West Africa, and the American South. There’s sushi, too, but you’re best offstarting with suya skewers before feasting on jerk lamb shank or peri peri chicken.","disambiguatingDescription":"Best Fusion Food, The Best of Big D 2026"}},{"@type":"ListItem","position":75,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tacos-el-metro","name":"Tacos El Metro","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tacos-el-metro","description":"Order the Puerco El Metro, a mixture of different cuts from a whole roasted pig folded into a tortilla and then garnished with fried pork skin, and ask for the Metro salsa, which balances creamy avocado with searing chile peppers. Or make a whole meal out of huesitos, salsa-coated rib tips.","disambiguatingDescription":"Best Tacos, The Best of Big D 2026"}},{"@type":"ListItem","position":76,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-gonzalez","name":"Gonzalez","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-gonzalez","description":"Nobody else makes a fluffy tortilla like Gonzalez. The Oak Cliffand Pleasant Grove institution does all the classics right, including fried-to-order crispy tacos that are easily the best in the region. Ask for the salsa fresca, and skip the salsa that comes to your table automatically.","disambiguatingDescription":"Best Tex-Mex, The Best of Big D 2026"}},{"@type":"ListItem","position":77,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-lyan-asian-market-restaurant","name":"Lyan Asian Market \u0026 Restaurant","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-lyan-asian-market-restaurant","description":"This small market is a treasure trove of specialty Asian items including Burmese fermented tea leaves, fried bean mix, and traditional clothing. The produce selection is small, but its gai choy and Thai eggplant are very fresh. Whole fish and Black Silkie chickens (with, yes, black skin) stock the freezers.","disambiguatingDescription":"Best Specialty Market, The Best of Big D 2026"}},{"@type":"ListItem","position":78,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-black-thai-authentic-cuisine","name":"Black Thai Authentic Cuisine","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-black-thai-authentic-cuisine","description":"Look for noodle dishes advertised as “authentic,” including pad Thai with dried spices and bold flavors of lime, peanut, tamarind, and garlic chives. Boat noodles are terrific, and specialties from southern Thailand, where owner Fon Johnson grew up, can be knockout-level hot.","disambiguatingDescription":"Best Thai, The Best of Big D 2026"}},{"@type":"ListItem","position":79,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-sushi-kozy","name":"Sushi Kozy","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-sushi-kozy","description":"In an age of omakase bounty, Sushi Kozy stands out by virtue of variety. You’ll get a range of seafood, prepared with tradition and simplicity in mind, bookended by more creative kitchen dishes that combine French and Japanese technique. There’s nothing else like it in town.","disambiguatingDescription":"Best Tasting Menu, The Best of Big D 2026"}},{"@type":"ListItem","position":80,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-alara-modern-mediterranean","name":"Alara Modern Mediterranean","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-alara-modern-mediterranean","description":"Load up on the appetizer dips and fresh-baked pita breads, then order a lion’s mane mushroom grilled like a steak kebab, complete with chimichurri. (It also comes with lemony grilled sugar snap peas.) Don’t miss Halloumi cheese baked in a pastry crust and drizzled with honey.","disambiguatingDescription":"Best Vegetarian-Friendly, The Best of Big D 2026"}},{"@type":"ListItem","position":81,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-atelie","name":"Ateliê","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-atelie","description":"There might not be a more romantic dining room in town than this candlelit art gallery, where you can sample foods that represent chef Wyl Lima’s globetrotting personal journey while admiring the paintings. Spike Lee recently bought a work from the walls. Next time he should stay for dinner.","disambiguatingDescription":"Best Studio Dinner, The Best of Big D 2026"}},{"@type":"ListItem","position":82,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-naminohana","name":"Naminohana","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-naminohana","description":"This popular Greenville Avenue counter has an all-around menu of handrolls, nigiri, and sashimi. Look to the chalkboard for the daily specials of justflown-in fish. We especially appreciate the casual atmosphere and affordable price point, rare in town for sushi of this caliber.","disambiguatingDescription":"Best Sushi, The Best of Big D 2026"}},{"@type":"ListItem","position":83,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cntrd-juice","name":"CNTRD Juice","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cntrd-juice","description":"It’s not TikTok hyperbole to say CNTRD’s smoothies are better than Erewhon. Stop in to the tiny, spartan space in Victory Park, order any of their seasonal smoothies, and receive a blended work of art that tastes as good as it looks.","disambiguatingDescription":"Best Smoothie, The Best of Big D 2026"}},{"@type":"ListItem","position":84,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-fancy-cakes-by-lauren","name":"Fancy Cakes by Lauren","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-fancy-cakes-by-lauren","description":"Lauren Kitchens can make a cake that looks like a plate of oysters or Bevo in repose. You’ve probably seen the SMU (and Ursuline) grad’s work on Food Network and maybe at the occasional party thrown by Jerry Jones, Mike Modano, Don Henley, Jewel, or Blake Shelton and Gwen Stefani.","disambiguatingDescription":"Best Occasion Cakes, The Best of Big D 2026"}},{"@type":"ListItem","position":85,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-la-casita-coffee-at-half-price-books","name":"La Casita Coffee at Half Price Books","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-la-casita-coffee-at-half-price-books","description":"The wood-paneled cafe is great for intimate get-togethers (i.e., morning-after meals or BFF gossip fests). You’ll be jealous of your date’s choice, so agree to split dishes, such as the crispy potato sandwich and espresso-soaked French toast. After, get Turkish lattes to go and keep the convo going as you wind through bookstore aisles.","disambiguatingDescription":"Best Brunch, The Best of Big D 2026"}},{"@type":"ListItem","position":86,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-royal-lane","name":"Royal Lane","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-royal-lane","description":"You know how the Grand Prairie Ikea is superior to the Frisco one because you can dash in and pick up a couple of picture frames and 10 pounds of salmon without walking 8 miles? The newest outpost of H Mart is like that. It’s got some of the freshest fish, produce, and meat in town, plus you can grab some chocorooms and a still-warm Spam musubi at checkout to snack on during the shorter drive home.","disambiguatingDescription":"Best H Mart, The Best of Big D 2026"}},{"@type":"ListItem","position":87,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mozzarella-co","name":"Mozzarella Co.","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mozzarella-co","description":"For more than four decades, this tiny but mighty Deep Ellum factory has produced award-winning cheeses, from mozzarella to queso Oaxaca to rosemary formaggio. The shop is stocked with just one refrigerator full of cheese, each handmade using fresh cow or goat milk. The ancho chile caciotta is divine.","disambiguatingDescription":"Best Cheese Shop, The Best of Big D 2026"}},{"@type":"ListItem","position":88,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tongue-in-cheek-ice-cream","name":"Tongue in Cheek Ice Cream","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-tongue-in-cheek-ice-cream","description":"The ice cream only needs to be so good when $4 buys you a single scoop that rivals most shops’ double. It just so happens that Tongue in Cheek’s also tastes outstanding. The Peanut Butter Buckeye Brownie is a crowd favorite, but save room for the decadent banana pudding flavor, too.","disambiguatingDescription":"Best Ice Cream, The Best of Big D 2026"}},{"@type":"ListItem","position":89,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-buzz-and-bustle","name":"Buzz and Bustle","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-buzz-and-bustle","description":"Many of the city’s coffee veterans, who have storied careers managing, roasting, or serving for Dallas shops, have landed at Buzz. They roast in-house and source beans from the Women Producer Program of ARGCAFEE, which supports women in the coffee industry. Those brews fuel the many laptop-toting worker bees who fill the spacious shop.","disambiguatingDescription":"Best Coffeehouse, The Best of Big D 2026"}},{"@type":"ListItem","position":90,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mikes-chicken","name":"Mike's Chicken","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-mikes-chicken","description":"Everything at this Vietnamese-owned spot is fried to order, resulting in hot, crispy chicken best paired with their coleslaw and mac and cheese. Hand-battered and fried in peanut oil, the thick breading on the wings and tenders is well seasoned and packs a crunch worthy of a viral TikTok mukbang.","disambiguatingDescription":"Best Fried Chicken, The Best of Big D 2026"}},{"@type":"ListItem","position":91,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-smokey-joes-bbq","name":"Smokey Joe's BBQ","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-smokey-joes-bbq","description":"Perhaps its location at the side of an interstate keeps Smokey Joe’s from developing the long lines and online fans common at more famous spots. The ribs would be enough to convert any skeptic, though. And the brakes, a South Dallas tradition of spiced rib trimmings, got their own moment in the sun this year after praise from James Talarico.","disambiguatingDescription":"Best Barbecue, The Best of Big D 2026"}},{"@type":"ListItem","position":92,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-stock-barrel","name":"Stock \u0026 Barrel","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-stock-barrel","description":"Dallas’ must-try burger map is full of smashed-into-lace patties, enough of them that an unpressed brisket-chuck, book-thick burger, grilled over hickory wood fire, feels momentous. Once your two-handsrequired monster arrives, press down to push the caramelized onion and zippy horseradish pickles into the beef.","disambiguatingDescription":"Best Burger, The Best of Big D 2026"}},{"@type":"ListItem","position":93,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-deep-cuts","name":"Deep Cuts","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-deep-cuts","description":"We’re full of admiration for the sausage links here, packed with flavor without extra grease. We also love the steaks, pork chops, duck breasts, and house-made red and green chorizos. The vacuum-sealed cured meats are our go-to for no-fuss dinner parties.","disambiguatingDescription":"Best Butcher Shop, The Best of Big D 2026"}},{"@type":"ListItem","position":94,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-caprese-at-little-heron-bakery","name":"The Caprese at Little Heron Bakery","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-caprese-at-little-heron-bakery","description":"This being a bakery, you shouldn’t be surprised that the sandwich starts with a pillowy hunk of focaccia best described as “We don’t need no stinkin’ side of chips”-sized. You’ll keep ordering it because Little Heron puts just as much care into what’s between the bread.","disambiguatingDescription":"Best Vegetarian Sandwich, The Best of Big D 2026"}},{"@type":"ListItem","position":95,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-potpourri-of-silk","name":"Potpourri of Silk","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-potpourri-of-silk","description":"In a city full of high-falutin teas (see: The French Room, Mirador, Dior), this quaint, yellow Bishop Arts teahouse has been offering everyday Dallasites a sweet, sunlit afternoon experience for three decades. The chinoiserie sets remind us of Grandma’s house, and the BYOB policy is a bonus.","disambiguatingDescription":"Best Tea Time, The Best of Big D 2026"}},{"@type":"ListItem","position":96,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-zon-zon","name":"Zon Zon","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-zon-zon","description":"Co-owner Yaser Khalaf never had cold hummus from a tub in his native Kuwait. To replicate a true Middle Eastern experience here, his kitchen takes the labor-intensive step of blending every batch fresh to order. You can ask to add roasted veggies or cubed filet mignon on top.","disambiguatingDescription":"Best Hummus, The Best of Big D 2026"}},{"@type":"ListItem","position":97,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-kubys-european-market-restaurant","name":"Kuby's European Market \u0026 Restaurant","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-kubys-european-market-restaurant","description":"Opened in 1961 by Karl Kuby, the eponymous shop now stocks hard-tofind imported goods in the market and serves a breakfast and lunch fit for the Honorary Consul of the Federal Republic of Germany in Dallas. That would be Nicola Bremer, who tells us she likes the house double-smoked pork chops.","disambiguatingDescription":"Best German, The Best of Big D 2026"}},{"@type":"ListItem","position":98,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cesars-tacos-y-gorditas","name":"Cesar's Tacos y Gorditas","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cesars-tacos-y-gorditas","description":"Walk inside, and it looks like they plopped El Si Hay in the middle of a former donut shop. The walled-offkitchen has a small order window on one side and pickup window on the other. There are four choices, all with egg. Straightforward, convenient, made fresh, tasty, and inexpensive: everything a breakfast taco should be.","disambiguatingDescription":"Best Breakfast Taco, The Best of Big D 2026"}},{"@type":"ListItem","position":99,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-johns-cafe","name":"John's Cafe","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-johns-cafe","description":"This greasy spoon has been slinging damn good food since 1972. Servers may act like stubborn grandfathers, but they will not let you leave dissatisfied. John’s giant biscuits should help on that front. We suggest you park far away; you’ll need to walk offbreakfast after leaving your table.","disambiguatingDescription":"Best Breakfast, The Best of Big D 2026"}},{"@type":"ListItem","position":100,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-la-rue-doughnuts","name":"La Rue Doughnuts","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-la-rue-doughnuts","description":"Be prepared to wait in line. Be prepared to pay more than $5 for a single donut. And be prepared for your mouth to go to heaven when you bite into a Cookies Butter Brioche donut that has been fermented and then fried in tallow, not the standard vegetable shortening.","disambiguatingDescription":"Best Donuts, The Best of Big D 2026"}},{"@type":"ListItem","position":101,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cattleack-barbeque","name":"Cattleack Barbeque","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-cattleack-barbeque","description":"When pastrami brisket is available on special at this iconic barbecue joint, ask for it in sandwich form. You’ll get a generous portion of smoked slices plus pickles and mustard, which are all the condiments you need to dress up some of the most flavorful meat in the whole state.","disambiguatingDescription":"Best Pastrami Sandwich, The Best of Big D 2026"}},{"@type":"ListItem","position":102,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-pacheco-taco-n-burger","name":"Pacheco Taco N Burger","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-pacheco-taco-n-burger","description":"The kitchen inside Four Corners Brewing Company turns out terrific burgers, carne asada fries, and nachos. The Texas Sun boasts a frizzle of skinny grilled onions, spicy sauce, and crisp beef patties that hang out over the bun’s edges. We keep room in our grease-filled hearts for the all-chorizo smash.","disambiguatingDescription":"Best Smashburger, The Best of Big D 2026"}},{"@type":"ListItem","position":103,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-nuri-steakhouse","name":"Nuri Steakhouse","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-nuri-steakhouse","description":"One of the few local steakhouses committed to sourcing Texas ranch beef, Nuri is equally committed to luxurious surroundings and service. Bring a group to share a bone-in cut from HeartBrand and a few bottles from the top-of-class wine cellar.","disambiguatingDescription":"Best Steakhouse, The Best of Big D 2026"}},{"@type":"ListItem","position":104,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-queen-bee","name":"Queen Bee","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-queen-bee","description":"We don’t talk enough about the spray tan gamble. When they turn out bad, you basically have to wear a potato sack until the stain fades. There is no such stress at Queen Bee. One D editor trusted them to airbrush on a natural tan two days before her wedding, with glowing results.","disambiguatingDescription":"Best Spray Tan, The Best of Big D 2026"}},{"@type":"ListItem","position":105,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-kick-pleat","name":"Kick Pleat","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-kick-pleat","description":"The designer mix is perfect. The layout is impeccable. And every purchase is a workhorse investment that will stand the test—and trends—of time. Only at Kick Pleat can you find Japanese Chimala jeans, Antwerp-adjacent knitwear, and Birkenstock’s luxury1774 line.","disambiguatingDescription":"Best Women’s Clothing Boutique, The Best of Big D 2026"}},{"@type":"ListItem","position":106,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-spa-at-the-joule","name":"The Spa at the Joule","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-the-spa-at-the-joule","description":"Whether we’re looking to relax following a stressful work week, celebrate a special occasion, or treat ourselves for no good reason at all, our RX is always the same: the Joule Spa. The moody subterranean space is where we leave our troubles for a few hours and emerge a new person.","disambiguatingDescription":"Best Hotel Spa, The Best of Big D 2026"}},{"@type":"ListItem","position":107,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-all-good-things","name":"All Good Things","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-all-good-things","description":"This Bishop Arts shop carries just what the name suggests in the form of housewares, accessories, and bathand-body goodies. But what draws us in again and again is the assortment of sweet letterpress greeting cards befitting any special occasion (or for no occasion at all). Pair one with a gift, or let your message stand alone.","disambiguatingDescription":"Best Greeting Cards, The Best of Big D 2026"}},{"@type":"ListItem","position":108,"item":{"@type":"Thing","@id":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-lepoque-parfums","name":"L'Epoque Parfums","url":"https://www.dmagazine.com/publications/d-magazine/2026/december/the-best-of-big-d-winners-2026/#w-lepoque-parfums","description":"Former Estée Lauder Co. beauty exec Rachel Green and master perfumer Elena Ruiz launched the small-batch fragrance
